# Packs all framework packages with one version and pushes them to GitHub Packages.
# Each push to main publishes the next preview: the highest v<base>-preview.<n> tag plus one, with <base> from
# Directory.Build.props. The workflow pushes that tag before the packages, so a failed run does not give the
# same number to a different commit. If the commit already has a preview tag, a rerun uses that version again.
# Push a tag v<version> (for example v0.1.0 or v0.2.0-preview.1) to publish that version by hand.
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: |
          dotnet run solution.cs
          dotnet test Umpire.slnx -c Release

      - name: Get the version from the tag
        if: github.ref_type == 'tag'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Get the preview version of the commit
        if: github.ref_type == 'branch'
        run: |
          base=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -1)
          existing=$(git tag --points-at HEAD --list "v$base-preview.*" | sort -V | tail -1)
          if [ -n "$existing" ]; then
            echo "VERSION=${existing#v}" >> "$GITHUB_ENV"
            echo "Commit already has $existing: publish it again."
            exit 0
          fi
          last=$(git tag --list "v$base-preview.*" | sed "s|^v$base-preview\.||" | grep -E '^[0-9]+$' | sort -n | tail -1)
          next="$base-preview.$(( ${last:-0} + 1 ))"
          git tag "v$next"
          git push origin "v$next"
          echo "VERSION=$next" >> "$GITHUB_ENV"

      # The same project list as tests/Shared/LocalFeed.cs (PackRoots): each project under architecture/, framework/, packs/, engine/ and tools/.
      # The projects that do not ship set IsPackable to false.
      - name: Pack
        run: |
          {
            echo '<Solution>'
            find architecture framework packs engine tools -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | sort | sed 's|.*|  <Project Path="&" />|'
            echo '</Solution>'
          } > pack.slnx
          dotnet pack pack.slnx -c Release -o feed -p:Version="$VERSION"

      - name: Push
        run: >
          dotnet nuget push "feed/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      # The release archive for hosts that cannot restore NuGet packages (tools/archive/archive.cs): the netstandard2.1
      # runtime, the definition DLLs, the analyzers and the engine, from the packages of this run. A version with a suffix is a prerelease.
      # A new release gets the archive in its create call, so a listener of "release published" sees the archive.
      - name: Make the release archive
        run: dotnet run tools/archive/archive.cs -- --feed feed --version "$VERSION" --out release --commit "$GITHUB_SHA"

      - name: Attach the archive to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          archive="release/umpire-$VERSION.zip"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$archive" --clobber
          else
            gh release create "v$VERSION" "$archive" --verify-tag --title "v$VERSION" --notes "Umpire $VERSION" $prerelease
          fi
