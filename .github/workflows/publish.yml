# Packs all framework packages with one version and pushes them to GitHub Packages.
# Push a tag v<version> (for example v0.1.0 or v0.2.0-preview.1) to publish that version.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Get the version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: |
          dotnet run solution.cs
          dotnet test VSA.slnx -c Release

      # The same project list as tests/Shared/LocalFeed.cs: each project under framework/.
      # The projects that do not ship set IsPackable to false.
      - name: Pack
        run: |
          {
            echo '<Solution>'
            find framework -name '*.csproj' | sort | sed 's|.*|  <Project Path="&" />|'
            echo '</Solution>'
          } > pack.slnx
          dotnet pack pack.slnx -c Release -o feed -p:Version="$VERSION"

      - name: Push
        run: >
          dotnet nuget push "feed/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
