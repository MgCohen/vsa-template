# Runs the same build and tests as Publish on each push to main, and by hand (workflow_dispatch). It does not run on a pull request (issue #134).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: |
          dotnet run solution.cs
          dotnet test Umpire.slnx -c Release
